name: Android APK

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  EFFECTCRAFT_VERSION: "0.17.0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

jobs:
  rust-gate:
    name: Upstream Rust quality gate
    # Fail fast on shell/browser problems before spending time on the full desktop test suite.
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libdbus-1-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-gate
          cache-on-failure: true
      - run: cargo xtask ci

  apk:
    name: Build and check testing APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify pinned EffectCraft release
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          assert version == os.environ["EFFECTCRAFT_VERSION"], f"Expected EffectCraft {os.environ['EFFECTCRAFT_VERSION']}, got {version}"
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          engine = [p for p in packages if p["name"] == "effectcraft" or p["name"].startswith("effectcraft-")]
          assert engine and all(p["version"] == version for p in engine), "EffectCraft lockfile versions must match the workspace"
          print(f"Building EffectCraft {version} from this checkout")
          PY
      - name: Touch and existing browser-host regression tests
        run: |
          node apps/effectcraft-web/tests/touch.mjs
          node apps/effectcraft-web/tests/phone.mjs
          node apps/effectcraft-web/tests/page.mjs
          node apps/effectcraft-web/tests/storage.mjs
          node apps/effectcraft-web/tests/cache.mjs
          node apps/effectcraft-web/tests/service-worker.mjs
          node apps/effectcraft-web/tests/workers.mjs
      - name: Real browser touch adapter regressions
        run: node apps/effectcraft-web/tests/touch-browser.mjs --chrome google-chrome
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired `tools` package, no longer in Google's repository.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Check Android shell before compiling the engine
        # Unit tests/lint need Java/resources, not a WASM bundle. Never assemble an APK here.
        run: gradle -p packaging/android :app:testDebugUnitTest :app:lintDebug -x :app:bundleEditor --stacktrace
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-web
          cache-on-failure: true
      - name: Install matching WebAssembly binding tool
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build the editor from this checkout
        run: cargo xtask web
      - name: Android-mode browser smoke test
        run: node apps/effectcraft-web/tests/android-smoke.mjs --dist target/web/dist --chrome google-chrome --out target/android-smoke
      - name: WebView 4096-pixel texture-limit regression
        run: node apps/effectcraft-web/tests/android-smoke.mjs --dist target/web/dist --chrome google-chrome --out target/android-smoke-webgl4096 --webgl-4096
      - name: JVM export tests, Android lint, APK assembly
        run: gradle -p packaging/android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verify APK launcher name and icon
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging packaging/android/app/build/outputs/apk/debug/app-debug.apk > target/android-badging.txt
          grep -F "package: name='io.github.itsnold.ecdroid' versionCode='8' versionName='0.1.7-alpha'" target/android-badging.txt
          grep -F "application-label:'EffectCraft'" target/android-badging.txt
          grep -E "application: label='EffectCraft' icon='res/.+'" target/android-badging.txt
      - name: Checksum
        working-directory: packaging/android/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: effectcraft-android-debug
          path: |
            packaging/android/app/build/outputs/apk/debug/app-debug.apk
            packaging/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            target/android-smoke/
            target/android-smoke-webgl4096/
            target/android-badging.txt
            packaging/android/app/build/reports/
          if-no-files-found: ignore
